<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 조대 앞 맛집 탐방 최종 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; }
        .navbar-brand { font-weight: bold; color: #2c3e50; }
        .card-stat { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 100%; }
        /* 맛집 링크 호버 디자인 */
        .map-link { transition: color 0.2s; }
        .map-link:hover { text-decoration: underline !important; color: #0d6efd !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎓 Chosun Univ. 맛집 탐방 대시보드 (주소 매핑 최종본)</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-stat bg-primary text-white p-3">
                    <div class="text-white-50 small">정복한 총 맛집 수</div>
                    <div id="stat-total" class="fs-3 fw-bold">0 곳</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-success text-white p-3">
                    <div class="text-white-50 small">평균 맛집 평점</div>
                    <div id="stat-rating" class="fs-3 fw-bold">⭐ 0.0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-warning text-dark p-3">
                    <div class="text-dark-50 small">평균 지출 가격대</div>
                    <div id="stat-price" class="fs-3 fw-bold">0 원</div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card card-stat p-4 h-100 bg-white">
                    <h5 class="fw-bold mb-3">🔍 캠퍼스 위치 필터</h5>
                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <button class="btn btn-sm btn-dark filter-btn" onclick="filterLocation('전체')">전체보기</button>
                        <button class="btn btn-sm btn-outline-secondary filter-btn" onclick="filterLocation('조대후문')">조대후문</button>
                        <button class="btn btn-sm btn-outline-secondary filter-btn" onclick="filterLocation('조대정문')">조대정문</button>
                    </div>
                    <p class="small text-muted">💡 식당 이름을 누르면 해당 맛집의 <b>네이버 지도</b>로 연결되어 정확한 위치가 즉시 조회됩니다.</p>
                </div>
            </div>
            <div class="col-md-8">
                <div class="chart-container">
                    <h5 class="fw-bold mb-3">📊 카테고리별 맛집 분포 지분</h5>
                    <div style="max-height: 220px; display: flex; justify-content: center;">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container mb-5">
            <h5 class="fw-bold mb-3">📋 맛집 탐방 실시간 리스트 (이름 클릭 시 지도 위치 추적)</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>식당명 (지도보기)</th>
                            <th>카테고리</th>
                            <th>위치</th>
                            <th>평균 가격</th>
                            <th>평점</th>
                            <th>나만의 한줄평 크리틱</th>
                        </tr>
                    </thead>
                    <tbody id="restaurant-tbody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // [1단계] 지도 검색 실패를 완벽히 차단하기 위해 네이버 지도 실재 주소(address) 필드를 추가했습니다.
        const restaurantData = [
            { "id": 1, "name": "줄벼락", "category": "한식/분식", "location": "조대후문", "address": "광주 동구 지산로6번길 5", "avgPrice": 8500, "rating": 4.5, "review": "냉면 시키면 숯불고기가 세트로 나오는 후문 대표 가성비 맛집" },
            { "id": 2, "name": "참이모네식당", "category": "한식/분식", "location": "조대후문", "address": "광주 동구 필문대로287번길 19-2", "avgPrice": 8000, "rating": 4.6, "review": "반찬을 뷔페식으로 떠다 먹는 든든한 백반과 즉석 떡볶이 명가" },
            { "id": 3, "name": "영암빈대떡", "category": "요리/주점", "location": "조대후문", "address": "광주 동구 지산로 10-1", "avgPrice": 14000, "rating": 4.8, "review": "비 오는 날 막걸리에 파전 생각날 때 무조건 가는 후문 터줏대감" },
            { "id": 4, "name": "제일반점", "category": "중식", "location": "조대후문", "address": "광주 동구 필문대로287번길 17", "avgPrice": 7500, "rating": 4.4, "review": "오랜 시간 조대생들의 점심을 책임져 준 노포 중식당" },
            { "id": 5, "name": "오성탕수육", "category": "요리/주점", "location": "조대후문", "address": "광주 동구 필문대로273번길 13", "avgPrice": 11000, "rating": 4.7, "review": "후문 골목에서 김치피자탕수육(김피탕)으로 야식계를 평정한 곳" },
            { "id": 6, "name": "서석식당", "category": "고기/구이", "location": "조대정문", "address": "광주 동구 서석동 435-5", "avgPrice": 11000, "rating": 4.6, "review": "조대 정문 공대 앞 골목에서 푸짐한 돼지주물럭과 삼겹살로 유서 깊은 찐 노포" }
        ];

        let myChart = null;

        window.onload = function() {
            renderDashboard(restaurantData);
        };

        function renderDashboard(data) {
            const totalCount = data.length;
            const avgRating = totalCount > 0 ? (data.reduce((sum, item) => sum + item.rating, 0) / totalCount).toFixed(1) : 0;
            const avgPrice = totalCount > 0 ? Math.round(data.reduce((sum, item) => sum + item.avgPrice, 0) / totalCount) : 0;

            document.getElementById('stat-total').innerText = `${totalCount} 곳`;
            document.getElementById('stat-rating').innerText = `⭐ ${avgRating} / 5.0`;
            document.getElementById('stat-price').innerText = `${avgPrice.toLocaleString()} 원`;

            const tbody = document.getElementById('restaurant-tbody');
            tbody.innerHTML = ''; 

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">조건에 맞는 맛집이 없습니다.</td></tr>`;
            } else {
                data.forEach(res => {
                    // 상호명 대신 100% 매핑이 보장되는 실제 주소(address)를 안전하게 인코딩하여 링크 생성
                    const encodedUrl = `https://map.naver.com/p/search/${encodeURIComponent(res.address)}`;

                    const row = `<tr>
                        <td class="fw-bold">
                            <a href="${encodedUrl}" target="_blank" class="text-decoration-none text-dark map-link">
                                📍 ${res.name}
                            </a>
                        </td>
                        <td><span class="badge bg-secondary">${res.category}</span></td>
                        <td>${res.location}</td>
                        <td>${res.avgPrice.toLocaleString()}원</td>
                        <td class="text-danger fw-bold">⭐ ${res.rating}</td>
                        <td class="text-muted">${res.review}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            }
            updateChart(data);
        }

        function filterLocation(loc) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if(btn.innerText.includes(loc) || (loc === '전체' && btn.innerText === '전체보기')) {
                    btn.classList.replace('btn-outline-secondary', 'btn-dark');
                } else {
                    btn.classList.remove('btn-dark');
                    btn.classList.add('btn-outline-secondary');
                }
            });

            if (loc === '전체') {
                renderDashboard(restaurantData);
            } else {
                const filtered = restaurantData.filter(item => item.location === loc);
                renderDashboard(filtered);
            }
        }

        function updateChart(data) {
            const counts = {};
            data.forEach(item => { counts[item.category] = (counts[item.category] || 0) + 1; });

            if (myChart) { myChart.destroy(); }

            const ctx = document.getElementById('categoryChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{
                        data: Object.values(counts),
                        backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
    </script>
</body>
</html>
